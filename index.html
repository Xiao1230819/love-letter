<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0510" />
<title>写给你的一封信</title>

<!--
  ==============================================================
   一封可以表白的网页情书
  --------------------------------------------------------------
   · 双击本文件即可打开，不需要联网，不需要安装任何东西
   · 想改名字、改文案：只改 <script> 里最上面的 CONFIG 对象
   · 想发给对方：直接把整个 index.html 发过去（电脑/手机浏览器打开）
     或者放到网页空间（GitHub Pages / Vercel / 任意静态托管），
     把链接发给她，效果最好
   · 也可以给链接加参数：index.html?to=小雨&from=阿泽
   · 小彩蛋：页面里随便点点，会有爱心冒出来
  ==============================================================
-->

<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --pink:      #ff5c8a;
    --pink-2:    #ff8f6b;
    --pink-soft: #ffb3cb;
    --gold:      #ffd9a0;
    --fog:       rgba(255, 245, 248, .88);
    --font-hand: "STXingkai", "华文行楷", "STKaiti", "KaiTi", "Kaiti SC", "楷体", "Songti SC", "Noto Serif SC", "SimSun", serif;
    --font-ui:   -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Segoe UI", system-ui, sans-serif;
    --ease-out:  cubic-bezier(.2, .9, .25, 1);
    --ease-back: cubic-bezier(.2, .9, .25, 1.45);
  }

  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100%;
    background: #080411;
    color: var(--fog);
    font-family: var(--font-ui);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  /* 背景光雾 */
  body::before {
    content: "";
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(70% 55% at 50% 108%, rgba(255, 58, 120, .30), transparent 72%),
      radial-gradient(45% 40% at 8% 4%, rgba(130, 70, 255, .22), transparent 70%),
      radial-gradient(40% 35% at 94% 12%, rgba(255, 166, 86, .16), transparent 72%),
      radial-gradient(120% 90% at 50% 50%, #170a21 0%, #080411 62%, #05030a 100%);
  }
  /* 暗角 */
  body::after {
    content: "";
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(120% 85% at 50% 50%, transparent 42%, rgba(0, 0, 0, .55) 100%);
  }

  #stage {
    position: fixed; inset: 0; z-index: 2;
    width: 100%; height: 100%;
    pointer-events: none;
  }

  /* ---------------- 场景 ---------------- */
  .scene {
    position: fixed; inset: 0; z-index: 3;
    display: flex;
    padding: max(5vh, 24px) 6vw;
    overflow-y: auto; overflow-x: hidden;
    opacity: 0; visibility: hidden;
    transform: translateY(14px) scale(.985);
    transition: opacity .9s var(--ease-out), transform 1.1s var(--ease-out), visibility .9s;
    pointer-events: none;
    -webkit-overflow-scrolling: touch;
  }
  .scene.show {
    opacity: 1; visibility: visible;
    transform: none;
    pointer-events: auto;
  }
  .scene > .inner {
    margin: auto;
    width: 100%; max-width: 980px;
    display: flex; flex-direction: column;
    align-items: center; text-align: center;
  }

  /* ---------------- 第一幕 ---------------- */
  .start.show .inner > * { animation: endIn .95s var(--ease-out) both; }
  .start.show .inner > *:nth-child(1) { animation-delay: .10s; }
  .start.show .inner > *:nth-child(2) { animation-delay: .28s; }
  .start.show .inner > *:nth-child(3) { animation-delay: .55s; }

  .eyebrow {
    margin: 0 0 3.4vh;
    font-size: clamp(.62rem, 1.5vw, .76rem);
    letter-spacing: .55em;
    text-transform: uppercase;
    color: rgba(255, 214, 228, .5);
    font-weight: 500;
  }
  .eyebrow #toName { color: var(--gold); letter-spacing: .2em; }

  .heart-btn {
    background: none; border: 0; padding: 0;
    cursor: pointer; color: inherit;
    display: flex; flex-direction: column; align-items: center;
    gap: 1.7rem;
  }
  .heart-svg {
    width: clamp(96px, 22vw, 152px);
    height: auto;
    overflow: visible;
    filter: drop-shadow(0 0 20px rgba(255, 80, 140, .62)) drop-shadow(0 0 64px rgba(255, 60, 110, .38));
    animation: heartbeat 2.6s ease-in-out infinite;
    transition: filter .4s ease;
  }
  .heart-btn:hover .heart-svg {
    filter: drop-shadow(0 0 26px rgba(255, 110, 160, .9)) drop-shadow(0 0 80px rgba(255, 60, 110, .55));
  }
  .heart-btn:active .heart-svg { transform: scale(.96); }
  .heart-label {
    font-family: var(--font-hand);
    font-size: clamp(.95rem, 2.6vw, 1.12rem);
    letter-spacing: .42em;
    padding-left: .42em;
    color: rgba(255, 235, 242, .92);
    text-shadow: 0 0 20px rgba(255, 90, 140, .65);
  }
  .hint {
    margin: 5vh 0 0;
    font-size: .74rem;
    letter-spacing: .26em;
    color: rgba(255, 225, 235, .4);
  }

  /* ---------------- 第二幕 ---------------- */
  .main { gap: 0; }

  .lines {
    display: flex; flex-direction: column;
    align-items: center;
    gap: .55em;
    max-width: 36em;
    margin-bottom: .3em;
    font-size: clamp(1.02rem, 1.1vw + .72rem, 1.4rem);
    line-height: 1.85;
  }
  .line {
    margin: 0;
    font-family: var(--font-hand);
    letter-spacing: .05em;
    color: rgba(255, 240, 246, .92);
    text-shadow: 0 0 26px rgba(255, 110, 150, .28);
    animation: lineIn .8s var(--ease-out) both;
  }
  .line.typing::after {
    content: "▏";
    margin-left: .08em;
    color: var(--pink-soft);
    text-shadow: 0 0 12px rgba(255, 120, 160, .95);
    animation: blink 1s steps(1) infinite;
  }

  .truth-wrap {
    position: relative;
    display: inline-grid;
    place-items: center;
    isolation: isolate;
    margin: 1.2vh 0 1.6vh;
    opacity: 0;
    filter: blur(13px);
    transform: scale(.97);
    pointer-events: none;
    transition:
      opacity 1.1s var(--ease-out),
      filter 1.5s var(--ease-out),
      transform 1.6s var(--ease-out);
  }
  .truth-wrap.on {
    opacity: 1;
    filter: blur(0);
    transform: none;
  }
  .truth-wrap::before {
    content: "";
    position: absolute; inset: -45% -34%; z-index: -1;
    background: radial-gradient(closest-side, rgba(255, 70, 130, .34), rgba(255, 70, 130, 0) 72%);
    filter: blur(8px);
    animation: breathe 6s ease-in-out infinite;
  }

  .truth {
    position: relative;
    margin: 0;
    font-family: var(--font-hand);
    font-weight: 700;
    font-size: clamp(3.2rem, 13.5vw, 7rem);
    line-height: 1.2;
    letter-spacing: .45em;
    padding-left: .45em;
    background: linear-gradient(100deg, #ffffff 0%, #ffe3ee 22%, #ff86ae 48%, #ffd9a0 72%, #ffffff 100%);
    background-size: 260% 100%;
    -webkit-background-clip: text; background-clip: text;
    color: transparent; -webkit-text-fill-color: transparent;
    animation: shimmer 9s linear infinite;
    transition: letter-spacing 1.7s var(--ease-out), padding-left 1.7s var(--ease-out);
  }
  .truth-wrap.on .truth {
    letter-spacing: .08em;
    padding-left: .08em;
  }

  .ask {
    position: relative;
    margin-top: 1.6vh;
    width: min(560px, 92vw);
    padding: clamp(20px, 3.2vw, 30px) clamp(18px, 4vw, 36px) clamp(22px, 3.4vw, 32px);
    border-radius: 26px;
    background: linear-gradient(160deg, rgba(255, 255, 255, .085), rgba(255, 255, 255, .028));
    border: 1px solid rgba(255, 255, 255, .14);
    box-shadow: 0 34px 76px -34px rgba(255, 60, 120, .6), inset 0 1px 0 rgba(255, 255, 255, .15);
    -webkit-backdrop-filter: blur(14px) saturate(125%);
    backdrop-filter: blur(14px) saturate(125%);
    opacity: 0; pointer-events: none;
    transform: translateY(22px) scale(.98);
    transition: opacity .9s var(--ease-out), transform 1.05s var(--ease-back);
  }
  .ask.on { opacity: 1; pointer-events: auto; transform: none; }

  .ask-q {
    margin: 0 0 .55em;
    font-family: var(--font-hand);
    font-size: clamp(1.18rem, 2.6vw + .7rem, 1.52rem);
    letter-spacing: .06em;
    color: #fff;
    text-shadow: 0 0 24px rgba(255, 100, 150, .5);
  }
  .ask-note {
    margin: 0 0 1.5em;
    font-size: clamp(.78rem, 1.6vw, .9rem);
    line-height: 1.85;
    color: rgba(255, 228, 238, .58);
  }

  .actions {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    gap: 14px; flex-wrap: wrap;
  }

  /* ---------------- 按钮 ---------------- */
  .btn {
    font-family: var(--font-ui);
    font-size: clamp(.98rem, 2.5vw, 1.1rem);
    letter-spacing: .1em;
    white-space: nowrap;
    border-radius: 999px;
    padding: .92em 2.1em;
    border: 1px solid transparent;
    cursor: pointer;
    transition:
      transform .45s var(--ease-back),
      box-shadow .35s ease,
      background .35s ease,
      opacity .45s ease;
  }
  .btn-yes {
    font-weight: 700;
    color: #2a0913;
    background: linear-gradient(135deg, #ff5c8a, #ff8f6b 58%, #ffc46b);
    box-shadow: 0 12px 34px -10px rgba(255, 80, 130, .9), inset 0 0 0 1px rgba(255, 255, 255, .3);
  }
  .btn-yes:hover {
    box-shadow: 0 16px 42px -8px rgba(255, 88, 140, 1), inset 0 0 0 1px rgba(255, 255, 255, .5);
    filter: brightness(1.05);
  }
  .btn-yes.huge {
    transform: scale(1.12);
    animation: yesPulse 1.9s ease-in-out infinite;
  }
  .btn-no {
    color: rgba(255, 240, 246, .72);
    background: rgba(255, 255, 255, .07);
    border-color: rgba(255, 255, 255, .18);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
  }
  .btn-no:hover { background: rgba(255, 255, 255, .13); }
  .btn-ghost {
    color: rgba(255, 240, 246, .82);
    background: rgba(255, 255, 255, .06);
    border-color: rgba(255, 255, 255, .18);
  }
  .btn-ghost:hover { background: rgba(255, 255, 255, .13); }
  .no-placeholder { display: block; }

  /* ---------------- 第三幕 ---------------- */
  .end.show .inner > * { animation: endIn 1s var(--ease-out) both; }
  .end.show .inner > *:nth-child(1) { animation-delay: .05s; }
  .end.show .inner > *:nth-child(2) { animation-delay: .30s; }
  .end.show .inner > *:nth-child(3) { animation-delay: .55s; }
  .end.show .inner > *:nth-child(4) { animation-delay: .75s; }
  .end.show .inner > *:nth-child(5) { animation-delay: .95s; }

  .end-heart svg {
    width: clamp(82px, 17vw, 116px);
    overflow: visible;
    filter: drop-shadow(0 0 24px rgba(255, 90, 145, .7)) drop-shadow(0 0 70px rgba(255, 60, 110, .4));
    animation: heartbeat 2.3s ease-in-out infinite;
  }
  .end-title {
    position: relative;
    margin: .55em 0 .35em;
    font-family: var(--font-hand);
    font-size: clamp(1.9rem, 6.4vw, 3.3rem);
    letter-spacing: .1em;
    padding-left: .1em;
    background: linear-gradient(100deg, #ffffff, #ffd3e2 26%, #ff7aa8 52%, #ffe4bd 76%, #ffffff);
    background-size: 250% 100%;
    -webkit-background-clip: text; background-clip: text;
    color: transparent; -webkit-text-fill-color: transparent;
    animation: shimmer 8s linear infinite;
  }
  .end-title::before {
    content: "";
    position: absolute; left: 50%; top: 50%;
    width: 150%; height: 260%;
    transform: translate(-50%, -50%);
    z-index: -1;
    background: radial-gradient(closest-side, rgba(255, 88, 142, .4), rgba(255, 88, 142, 0) 72%);
    filter: blur(10px);
    pointer-events: none;
  }
  .end-text {
    margin: 0 auto 1.7em;
    max-width: 30em;
    font-family: var(--font-hand);
    font-size: clamp(1rem, 2.4vw, 1.24rem);
    line-height: 2;
    color: rgba(255, 240, 246, .88);
    text-shadow: 0 0 26px rgba(255, 110, 150, .22);
  }
  .end-sign {
    margin: 0 0 .55em;
    font-family: var(--font-hand);
    font-size: clamp(.95rem, 2vw, 1.1rem);
    letter-spacing: .12em;
    color: var(--gold);
  }
  .end-date {
    margin: 0 0 2.6em;
    font-size: .74rem;
    letter-spacing: .2em;
    color: rgba(255, 225, 235, .42);
  }

  /* ---------------- 音乐开关 ---------------- */
  #audioBtn {
    position: fixed;
    top: max(16px, env(safe-area-inset-top));
    right: max(16px, env(safe-area-inset-right));
    z-index: 60;
    width: 42px; height: 42px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: rgba(255, 255, 255, .07);
    border: 1px solid rgba(255, 255, 255, .16);
    color: rgba(255, 240, 246, .78);
    font-size: 1.05rem;
    cursor: pointer;
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    transition: transform .3s var(--ease-back), background .3s, color .3s;
  }
  #audioBtn:hover { transform: scale(1.09); background: rgba(255, 255, 255, .14); }
  #audioBtn.off { color: rgba(255, 240, 246, .3); }
  #audioBtn.off::after {
    content: "";
    position: absolute;
    width: 60%; height: 1.6px;
    border-radius: 2px;
    background: currentColor;
    transform: rotate(-45deg);
  }

  /* ---------------- 动画 ---------------- */
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    14%      { transform: scale(1.09); }
    28%      { transform: scale(1); }
    42%      { transform: scale(1.05); }
    56%      { transform: scale(1); }
  }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @keyframes shimmer { 0% { background-position: 0% 50%; } 100% { background-position: 220% 50%; } }
  @keyframes breathe { 0%, 100% { opacity: .7; transform: scale(1); } 50% { opacity: 1; transform: scale(1.09); } }
  @keyframes lineIn {
    from { opacity: 0; transform: translateY(12px); filter: blur(5px); }
    to   { opacity: 1; transform: none; filter: none; }
  }
  @keyframes endIn {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes yesPulse {
    0%, 100% { box-shadow: 0 12px 34px -10px rgba(255, 80, 130, .9), 0 0 0 0 rgba(255, 130, 165, .5); }
    50%      { box-shadow: 0 16px 44px -6px rgba(255, 80, 130, 1), 0 0 0 16px rgba(255, 130, 165, 0); }
  }

  /* ---------------- 小屏适配 ---------------- */
  @media (max-width: 560px) {
    .ask { border-radius: 22px; }
    .actions { gap: 10px; }
    .btn { padding: .88em 1.75em; }
    .lines { gap: .45em; }
    .hint { letter-spacing: .18em; }
  }
  @media (max-height: 680px) {
    .lines { font-size: clamp(.94rem, 4vw, 1.1rem); }
    .truth { font-size: clamp(2.8rem, 12vw, 5.4rem); }
    .ask-note { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .25s !important;
    }
  }
</style>
</head>
<body>

<canvas id="stage" aria-hidden="true"></canvas>

<!-- ============ 第一幕：信封 / 爱心 ============ -->
<section class="scene start show" id="scene-start">
  <div class="inner">
    <p class="eyebrow">A LETTER FOR <span id="toName">你</span></p>

    <button class="heart-btn" id="openBtn" type="button" aria-label="打开这封信">
      <svg class="heart-svg" viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <linearGradient id="heartGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffa8c4" />
            <stop offset=".55" stop-color="#ff4f86" />
            <stop offset="1" stop-color="#ffb36b" />
          </linearGradient>
        </defs>
        <path fill="url(#heartGrad)" stroke="rgba(255,255,255,.55)" stroke-width=".7"
          d="M16 29 C3 19 1 13 1 9.5 C1 4.5 5 1 9.8 1 C13 1 15 2.8 16 4.8 C17 2.8 19 1 22.2 1 C27 1 31 4.5 31 9.5 C31 13 29 19 16 29 Z" />
      </svg>
      <span class="heart-label">点 击 开 启</span>
    </button>

    <p class="hint">戴 上 耳 机 · 效 果 会 更 好</p>
  </div>
</section>

<!-- ============ 第二幕：想说的话 ============ -->
<section class="scene" id="scene-main">
  <div class="inner main">
    <div class="lines" id="lines"></div>

    <div class="truth-wrap">
      <h1 class="truth" id="truth">我喜欢你</h1>
    </div>

    <div class="ask" id="ask">
      <p class="ask-q" id="askQ"></p>
      <p class="ask-note" id="askNote"></p>
      <div class="actions">
        <button class="btn btn-yes" id="yesBtn" type="button">我愿意 ♥</button>
        <button class="btn btn-no" id="noBtn" type="button">再想想…</button>
      </div>
    </div>
  </div>
</section>

<!-- ============ 第三幕：说好了 ============ -->
<section class="scene" id="scene-end">
  <div class="inner end">
    <div class="end-heart">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <linearGradient id="heartGrad2" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffd0dd" />
            <stop offset=".5" stop-color="#ff4f86" />
            <stop offset="1" stop-color="#ffc46b" />
          </linearGradient>
        </defs>
        <path fill="url(#heartGrad2)" stroke="rgba(255,255,255,.6)" stroke-width=".7"
          d="M16 29 C3 19 1 13 1 9.5 C1 4.5 5 1 9.8 1 C13 1 15 2.8 16 4.8 C17 2.8 19 1 22.2 1 C27 1 31 4.5 31 9.5 C31 13 29 19 16 29 Z" />
      </svg>
    </div>
    <h2 class="end-title" id="endTitle">那就说定啦 ♥</h2>
    <p class="end-text" id="endText"></p>
    <p class="end-sign" id="endSign"></p>
    <p class="end-date" id="endDate"></p>
    <button class="btn btn-ghost" id="replayBtn" type="button">再看一遍</button>
  </div>
</section>

<button id="audioBtn" type="button" aria-label="打开音乐">♪</button>

<noscript>
  <p style="position:fixed;inset:0;display:grid;place-items:center;color:#ffd9e4;font-family:sans-serif;z-index:99;">
    请用支持 JavaScript 的浏览器打开这封信 ♥
  </p>
</noscript>

<script>
'use strict';
(function () {

  /* ============================================================
     ① 想改的话，只改这里就行
     ------------------------------------------------------------
     to       对方的名字（出现在开头）
     from     你的署名
     lines    打字机逐行出现的话
     question 最后问的那句话
     noLabels 「再想想」按钮每次被点时的文字（越点越心虚）
     文案里可以用 {to} / {from} 自动替换成上面对应的名字
     ============================================================ */
  const CONFIG = {
    to: '黎志鹏',
    from: '黎志鹏',

    lines: [
      '有些话，在心里排练了很久，',
      '可每次见到你，又全都忘光了。',
      '所以我把想说的，都写进了这封信里，',
      '想鼓起勇气，认认真真地交给你。'
    ],

    question: '可以，和我在一起吗？',
    note: '我知道这有点突然，可这句话，我已经偷偷练习了很久。',

    yesLabel: '我愿意 ♥',
    noLabels: ['再想想…', '真的不吗？', '我会一直对你好的', '给我个机会嘛', '好不好嘛～', '那我可要哭啦'],

    endTitle: '那就说定啦 ♥',
    endText: '从今天起，晚风、落日、还有我，都想陪你一起看。',
    endSign: null,          /* null 时自动用「—— 你的名字」 */
    replayLabel: '再看一遍'
  };
  /* ============================================================ */


  /* -------------------- 小工具 -------------------- */
  const $   = (sel, root = document) => root.querySelector(sel);
  const sleep = ms => new Promise(res => setTimeout(res, ms));
  const rnd  = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[(Math.random() * arr.length) | 0];
  const fmt  = s => String(s).replace(/\{to\}/g, CONFIG.to).replace(/\{from\}/g, CONFIG.from);

  /* -------------------- 元素 -------------------- */
  const sceneStart = $('#scene-start');
  const sceneMain  = $('#scene-main');
  const sceneEnd   = $('#scene-end');
  const openBtn    = $('#openBtn');
  const linesEl    = $('#lines');
  const truthWrap  = $('.truth-wrap');
  const askEl      = $('#ask');
  const askQ       = $('#askQ');
  const askNote    = $('#askNote');
  const yesBtn     = $('#yesBtn');
  const noBtn      = $('#noBtn');
  const endTitle   = $('#endTitle');
  const endText    = $('#endText');
  const endSign    = $('#endSign');
  const endDate    = $('#endDate');
  const replayBtn  = $('#replayBtn');
  const audioBtn   = $('#audioBtn');

  function goScene(name) {
    sceneStart.classList.toggle('show', name === 'start');
    sceneMain.classList.toggle('show', name === 'main');
    sceneEnd.classList.toggle('show', name === 'end');
  }


  /* ============================================================
     ② 打字机 + 剧情
     ============================================================ */
  let storyToken = 0;

  async function typeLine(el, text, speed) {
    el.classList.add('typing');
    for (let i = 0; i < text.length; i++) {
      el.textContent += text[i];
      const ch = text[i];
      let d = speed + Math.random() * 45;
      if ('，、；：'.includes(ch)) d += 170;
      if ('。！？…'.includes(ch)) d += 330;
      await sleep(d);
    }
    el.classList.remove('typing');
  }

  async function playStory() {
    const token = ++storyToken;
    linesEl.innerHTML = '';
    truthWrap.classList.remove('on');
    askEl.classList.remove('on');

    await sleep(680);

    for (const raw of CONFIG.lines) {
      if (token !== storyToken) return;
      const p = document.createElement('p');
      p.className = 'line';
      linesEl.appendChild(p);
      await typeLine(p, fmt(raw), 82);
      await sleep(380);
    }

    if (token !== storyToken) return;
    await sleep(400);
    truthWrap.classList.add('on');

    await sleep(1150);
    if (token !== storyToken) return;
    askEl.classList.add('on');
  }


  /* ============================================================
     ③ 「再想想」会躲 + 「我愿意」会变大
     ============================================================ */
  let answered = false;
  let noClicks = 0;
  let noFloating = false;

  function resetAsk() {
    answered = false;
    noClicks = 0;
    noFloating = false;

    const ph = $('.no-placeholder');
    if (ph) ph.remove();

    /* 「再想想」可能已经被挪到 body 上了，送它回卡片里 */
    const actions = $('.actions');
    if (actions && noBtn.parentNode !== actions) actions.appendChild(noBtn);

    noBtn.removeAttribute('style');
    noBtn.className = 'btn btn-no';
    noBtn.textContent = CONFIG.noLabels[0];

    yesBtn.removeAttribute('style');
    yesBtn.className = 'btn btn-yes';

    askNote.textContent = fmt(CONFIG.note);
  }

  function dodgeNo() {
    if (!noFloating) {
      noFloating = true;
      const r = noBtn.getBoundingClientRect();

      /* 占位，别让「我愿意」跳位置 */
      const ph = document.createElement('span');
      ph.className = 'no-placeholder';
      ph.style.width = r.width + 'px';
      ph.style.height = r.height + 'px';
      noBtn.parentNode.insertBefore(ph, noBtn);

      /* 挪到 body：卡片有 backdrop-filter，会成为 fixed 的包含块，
         不挪出来的话按钮会算错坐标、跑到屏幕外 */
      document.body.appendChild(noBtn);

      noBtn.style.position = 'fixed';
      noBtn.style.left = r.left + 'px';
      noBtn.style.top = r.top + 'px';
      noBtn.style.margin = '0';
      noBtn.style.zIndex = '40';
      noBtn.style.transition = 'transform .5s cubic-bezier(.2,.9,.2,1.5), opacity .5s';
    }

    const baseX = parseFloat(noBtn.style.left) || 0;
    const baseY = parseFloat(noBtn.style.top) || 0;
    const w = noBtn.offsetWidth || 120;
    const h = noBtn.offsetHeight || 44;
    const m = 12;
    const x = m + Math.random() * Math.max(0, window.innerWidth - w - m * 2);
    const y = m + Math.random() * Math.max(0, window.innerHeight - h - m * 2);
    const scale = Math.max(.62, 1 - noClicks * .07);

    noBtn.style.transform = 'translate(' + (x - baseX) + 'px,' + (y - baseY) + 'px) scale(' + scale + ')';
    yesBtn.style.transform = 'scale(' + Math.min(1.3, 1 + noClicks * .085) + ')';
  }

  function onNoClick() {
    noClicks++;

    if (noClicks >= CONFIG.noLabels.length) {
      escapeNo();
      return;
    }
    noBtn.textContent = CONFIG.noLabels[noClicks];
    dodgeNo();
  }

  function escapeNo() {
    noBtn.textContent = '（它害羞地跑掉了）';
    dodgeNo();
    setTimeout(() => { noBtn.style.opacity = '0'; }, 600);
    setTimeout(() => { noBtn.style.pointerEvents = 'none'; }, 700);
    setTimeout(() => { const ph = $('.no-placeholder'); if (ph) ph.remove(); }, 780);

    yesBtn.style.transform = '';
    yesBtn.classList.add('huge');
    askNote.textContent = '别追啦，它跑得可快了。';
  }


  /* ============================================================
     ④ 她说「我愿意」
     ============================================================ */
  async function onYes() {
    if (answered) return;
    answered = true;

    const r = yesBtn.getBoundingClientRect();
    burstAt(r.left + r.width / 2, r.top + r.height / 2, 140);
    rainUntil = performance.now() + 9000;
    playChime();

    await sleep(460);

    const now = new Date();
    endTitle.textContent = fmt(CONFIG.endTitle);
    endText.textContent = fmt(CONFIG.endText);
    endSign.textContent = CONFIG.endSign || ('—— ' + CONFIG.from);
    endDate.textContent = now.getFullYear() + ' 年 ' + (now.getMonth() + 1) + ' 月 ' + now.getDate() +
      ' 日 · 我们在一起的第一天';

    goScene('end');
    setTimeout(() => burstAt(window.innerWidth / 2, window.innerHeight * .42, 80), 520);
  }

  function showEnd() {
    const now = new Date();
    endTitle.textContent = fmt(CONFIG.endTitle);
    endText.textContent = fmt(CONFIG.endText);
    endSign.textContent = CONFIG.endSign || ('—— ' + CONFIG.from);
    endDate.textContent = now.getFullYear() + ' 年 ' + (now.getMonth() + 1) + ' 月 ' + now.getDate() +
      ' 日 · 我们在一起的第一天';
    goScene('end');
    setTimeout(() => burstAt(window.innerWidth / 2, window.innerHeight * .42, 90), 320);
  }


  /* ============================================================
     ⑤ 背景音乐（WebAudio 现场合成，不需要任何音频文件）
     ============================================================ */
  let actx = null;
  let master = null;
  let audioOn = false;
  let musicTimer = null;
  let musicStep = 0;
  let nextNoteTime = 0;

  const CHORDS  = [[53, 57, 60, 64], [55, 59, 62, 67], [52, 55, 59, 62], [57, 60, 64, 67]];
  const PATTERN = [0, 2, 3, 1, 2, 3, 1, 2];
  const STEP = 60 / 66 / 2;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  function startAudio() {
    if (actx) {
      if (actx.state === 'suspended') actx.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { audioBtn.style.display = 'none'; return; }
    try { actx = new AC(); } catch (e) { audioBtn.style.display = 'none'; return; }
    if (actx.state === 'suspended') actx.resume();

    master = actx.createGain();
    master.gain.setValueAtTime(0.0001, actx.currentTime);

    const lp = actx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 3000;

    const delay = actx.createDelay(1.0);
    delay.delayTime.value = 0.36;
    const fb = actx.createGain();
    fb.gain.value = 0.26;
    const wet = actx.createGain();
    wet.gain.value = 0.2;

    master.connect(lp);
    lp.connect(actx.destination);
    lp.connect(delay);
    delay.connect(fb);
    fb.connect(delay);
    delay.connect(wet);
    wet.connect(actx.destination);

    master.gain.exponentialRampToValueAtTime(0.15, actx.currentTime + 3);

    audioOn = true;
    musicStep = 0;
    nextNoteTime = actx.currentTime + 0.2;
    musicTimer = setInterval(scheduleMusic, 120);
    scheduleMusic();
    audioBtn.classList.remove('off');
  }

  function scheduleMusic() {
    if (!actx || !master) return;
    /* 切走标签页再回来时，别一次性补排一大串音符 */
    if (nextNoteTime < actx.currentTime - 0.4) nextNoteTime = actx.currentTime + 0.05;
    while (nextNoteTime < actx.currentTime + 0.8) {
      const chord = CHORDS[Math.floor(musicStep / 8) % CHORDS.length];
      if (musicStep % 8 === 0) {
        playPad(chord, nextNoteTime);
        playBass(chord[0] - 12, nextNoteTime);
      }
      playPluck(mtof(chord[PATTERN[musicStep % 8]] + 12), nextNoteTime, 0.075);
      nextNoteTime += STEP;
      musicStep++;
    }
  }

  function playPluck(freq, t, vol) {
    const o = actx.createOscillator();
    o.type = 'sine'; o.frequency.value = freq;
    const o2 = actx.createOscillator();
    o2.type = 'triangle'; o2.frequency.value = freq * 2;
    const g = actx.createGain();
    const g2 = actx.createGain();
    g2.gain.value = 0.12;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.5);
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(master);
    o.start(t); o.stop(t + 1.6);
    o2.start(t); o2.stop(t + 1.6);
  }

  function playPad(chord, t) {
    chord.forEach((m, i) => {
      const o = actx.createOscillator();
      o.type = 'sine';
      o.frequency.value = mtof(m);
      o.detune.value = (i % 2 ? 5 : -5);
      const g = actx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.028, t + 1.1);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 4.2);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + 4.4);
    });
  }

  function playBass(midi, t) {
    const o = actx.createOscillator();
    o.type = 'sine'; o.frequency.value = mtof(midi);
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.06, t + 0.06);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.8);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 3);
  }

  function playChime() {
    if (!actx || !audioOn) return;
    const notes = [77, 81, 84, 89, 93];
    const t0 = actx.currentTime + 0.06;
    notes.forEach((m, i) => {
      const t = t0 + i * 0.12;
      const o = actx.createOscillator();
      o.type = 'sine'; o.frequency.value = mtof(m);
      const o2 = actx.createOscillator();
      o2.type = 'sine'; o2.frequency.value = mtof(m) * 2.01;
      const g = actx.createGain();
      const g2 = actx.createGain();
      g2.gain.value = 0.15;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.07, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.8);
      o.connect(g); o2.connect(g2); g2.connect(g); g.connect(master);
      o.start(t); o.stop(t + 1.9);
      o2.start(t); o2.stop(t + 1.9);
    });
  }

  function toggleAudio() {
    if (!actx) { startAudio(); return; }
    if (actx.state === 'suspended') actx.resume();

    audioOn = !audioOn;
    const t = actx.currentTime;
    master.gain.cancelScheduledValues(t);
    master.gain.setValueAtTime(Math.max(0.0001, master.gain.value), t);
    master.gain.exponentialRampToValueAtTime(audioOn ? 0.15 : 0.0001, t + 0.35);
    audioBtn.classList.toggle('off', !audioOn);
    audioBtn.setAttribute('aria-label', audioOn ? '关闭音乐' : '打开音乐');
  }


  /* ============================================================
     ⑥ 背景：星星 / 光斑 / 飘心 / 粒子爆发
     ============================================================ */
  const canvas = $('#stage');
  const ctx = canvas.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W = 0, H = 0, DPR = 1;

  function resizeCanvas() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  const heartColors = ['#ff7fb0', '#ffa6c9', '#ffd9a0', '#d9b8ff', '#ffb08a'];
  const rgbaCache = new Map();

  function hexA(hex, a) {
    const key = hex + '|' + a.toFixed(3);
    let out = rgbaCache.get(key);
    if (out) return out;
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    out = 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
    if (rgbaCache.size > 600) rgbaCache.clear();
    rgbaCache.set(key, out);
    return out;
  }

  const stars = Array.from({ length: reduceMotion ? 45 : 130 }, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    r: rnd(.4, 1.5),
    p: Math.random() * 6.283,
    s: rnd(.5, 1.8),
    c: pick(['#ffffff', '#ffe6ef', '#ffe9c4'])
  }));

  const bokehs = Array.from({ length: reduceMotion ? 8 : 22 }, () => {
    const c = pick(['#ff5c8a', '#a86bff', '#ffb36b']);
    const a = rnd(.025, .07);
    return {
      x: rnd(0, W), y: rnd(0, H),
      r: rnd(40, 155),
      vx: rnd(-.06, .06),
      vy: rnd(-.32, -.08),
      c0: hexA(c, 0),
      c1: hexA(c, a)
    };
  });

  const hearts = [];
  const parts = [];
  let rainUntil = 0;
  let spawnAcc = 0;

  function spawnHeart(falling) {
    hearts.push({
      x: rnd(0, W),
      y: falling ? rnd(-70, -10) : H + rnd(10, 60),
      r: falling ? rnd(8, 20) : rnd(6, 22),
      vy: falling ? rnd(.7, 2.1) : -rnd(.3, 1.1),
      phase: Math.random() * 6.283,
      sp: rnd(.5, 1.5),
      sway: rnd(10, 40),
      rot: rnd(-.5, .5),
      vr: rnd(-.012, .012),
      a: rnd(.14, .42),
      c: pick(heartColors)
    });
  }

  function burstAt(x, y, n) {
    if (parts.length > 560) return;
    const total = reduceMotion ? Math.round(n * .4) : n;
    for (let i = 0; i < total; i++) {
      const a = Math.random() * 6.283;
      const sp = rnd(1.2, 7.5);
      const spark = Math.random() < .38;
      parts.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - rnd(.5, 1.4),
        r: spark ? rnd(.8, 2.4) : rnd(4, 14),
        rot: Math.random() * 6.283,
        vr: rnd(-.22, .22),
        life: 1,
        decay: rnd(.008, .019),
        spark: spark,
        c: pick(heartColors)
      });
    }
  }

  /* 用贝塞尔画一颗心 */
  function drawHeart(x, y, size, rot, color, alpha, glow) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    const s = size / 32;
    ctx.scale(s, s);
    ctx.beginPath();
    ctx.moveTo(16, 29);
    ctx.bezierCurveTo(3, 19, 1, 13, 1, 9.5);
    ctx.bezierCurveTo(1, 4.5, 5, 1, 9.8, 1);
    ctx.bezierCurveTo(13, 1, 15, 2.8, 16, 4.8);
    ctx.bezierCurveTo(17, 2.8, 19, 1, 22.2, 1);
    ctx.bezierCurveTo(27, 1, 31, 4.5, 31, 9.5);
    ctx.bezierCurveTo(31, 13, 29, 19, 16, 29);
    ctx.closePath();
    ctx.globalAlpha = alpha;
    if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
    ctx.fillStyle = color;
    ctx.fill();
    ctx.restore();
  }

  let tPrev = performance.now();

  function frame(now) {
    const dt = Math.min(2.5, Math.max(.2, (now - tPrev) / 16.667));
    tPrev = now;

    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';

    /* 光斑 */
    for (const b of bokehs) {
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      if (b.y < -b.r * 1.5) { b.y = H + b.r; b.x = rnd(0, W); }
      if (b.x < -b.r) b.x = W + b.r;
      else if (b.x > W + b.r) b.x = -b.r;

      const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
      g.addColorStop(0, b.c1);
      g.addColorStop(1, b.c0);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, 6.28318);
      ctx.fill();
    }

    /* 星星 */
    for (const st of stars) {
      const tw = .3 + .7 * (.5 + .5 * Math.sin(now * .0016 * st.s + st.p));
      ctx.globalAlpha = tw * .85;
      ctx.fillStyle = st.c;
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, 6.28318);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    /* 飘上来的心 */
    spawnAcc += dt;
    if (spawnAcc > 24) {
      spawnAcc = 0;
      if (hearts.length < (reduceMotion ? 14 : 34)) spawnHeart(false);
    }
    /* 答应之后：心雨 */
    if (now < rainUntil && hearts.length < (reduceMotion ? 30 : 110) && Math.random() < .5) {
      spawnHeart(true);
    }

    for (let i = hearts.length - 1; i >= 0; i--) {
      const h = hearts[i];
      h.phase += h.sp * .02 * dt;
      h.x += Math.sin(h.phase) * h.sway * .01 * dt;
      h.y += h.vy * dt;
      h.rot += h.vr * dt;
      if (h.y < -90 || h.y > H + 90) { hearts.splice(i, 1); continue; }
      drawHeart(h.x, h.y, h.r, h.rot, h.c, h.a, 0);
    }
    ctx.globalAlpha = 1;

    /* 爆炸粒子 */
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= Math.pow(.983, dt);
      p.vy *= Math.pow(.983, dt);
      p.vy += .045 * dt;
      p.rot += p.vr * dt;
      p.life -= p.decay * dt;
      if (p.life <= 0) { parts.splice(i, 1); continue; }

      const alpha = Math.min(1, p.life * 1.2);
      if (p.spark) {
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.c;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, 6.28318);
        ctx.fill();
      } else {
        drawHeart(p.x, p.y, p.r, p.rot, p.c, alpha, 10);
      }
    }

    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    ctx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* 鼠标/手指划过的小心心 */
  let lastTrail = 0;
  window.addEventListener('pointermove', function (e) {
    const now = performance.now();
    if (now - lastTrail < 46) return;
    lastTrail = now;
    if (parts.length > 480) return;
    parts.push({
      x: e.clientX, y: e.clientY,
      vx: rnd(-.5, .5),
      vy: rnd(-1.4, -.5),
      r: rnd(2.5, 7),
      rot: Math.random() * 6.283,
      vr: rnd(-.1, .1),
      life: 1,
      decay: rnd(.016, .028),
      spark: false,
      c: pick(heartColors)
    });
  }, { passive: true });

  window.addEventListener('pointerdown', function (e) {
    burstAt(e.clientX, e.clientY, 14);
  }, { passive: true });


  /* ============================================================
     ⑦ 事件绑定 & 启动
     ============================================================ */
  openBtn.addEventListener('click', function () {
    startAudio();

    const heart = openBtn.querySelector('.heart-svg').getBoundingClientRect();
    burstAt(heart.left + heart.width / 2, heart.top + heart.height / 2, 64);

    goScene('main');
    playStory();
  });

  yesBtn.addEventListener('click', onYes);
  noBtn.addEventListener('click', onNoClick);
  audioBtn.addEventListener('click', toggleAudio);

  replayBtn.addEventListener('click', function () {
    storyToken++;
    resetAsk();
    linesEl.innerHTML = '';
    truthWrap.classList.remove('on');
    askEl.classList.remove('on');
    goScene('start');
  });

  function init() {
    /* 可选参数：?to=名字&from=你的名字 */
    const params = new URLSearchParams(location.search);
    if (params.get('to')) CONFIG.to = params.get('to');
    if (params.get('from')) CONFIG.from = params.get('from');

    $('#toName').textContent = CONFIG.to;
    askQ.textContent = fmt(CONFIG.question);
    askNote.textContent = fmt(CONFIG.note);
    yesBtn.textContent = CONFIG.yesLabel;
    noBtn.textContent = CONFIG.noLabels[0];
    replayBtn.textContent = CONFIG.replayLabel;

    endTitle.textContent = fmt(CONFIG.endTitle);
    endText.textContent = fmt(CONFIG.endText);
    endSign.textContent = CONFIG.endSign || ('—— ' + CONFIG.from);

    /* 预留台词区高度，避免打字时布局跳动 */
    const n = CONFIG.lines.length;
    linesEl.style.minHeight = n ? (n * 1.85 + Math.max(0, n - 1) * 0.55) + 'em' : '0';

    resetAsk();
    goScene('start');

    /* 调试用：?auto=1 直接播放；?skip=end 直接看结局 */
    const skip = params.get('skip');
    if (skip === 'end') {
      showEnd();
    } else if (params.get('auto') === '1') {
      goScene('main');
      playStory();
    }
  }

  init();
})();
</script>
</body>
</html>
